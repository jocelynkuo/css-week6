<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <title>register</title>
  </head>
  <body class="bg-dark">
    <%- include('./layout/header'); -%>

    <section
      class="welcome-form d-flex justify-content-center align-items-center"
    >
      <div class="container">
        <div class="row">
          <div class="col-12 col-lg-4 mx-auto d-flex flex-column gap-5">
            <div class="title text-center">
              <h2 class="mb-2">歡迎回來</h2>
              <p class="fs-lg text-text-secondary">
                登入以繼續使用 AI ToolVerse
              </p>
            </div>
            <!-- btn group -->
            <div class="d-flex flex-column gap-4">
              <button type="button" class="btn btn-outlined w-100">
                <img
                  class="w-16px me-2"
                  src="/assets/images/login-google.png"
                  alt=""
                />使用 Google 繼續
              </button>
              <button type="button" class="btn btn-outlined w-100">
                <img
                  class="w-16px me-2"
                  src="/assets/images/login-facebook.png"
                  alt=""
                />使用 Facebook 繼續
              </button>
              <button type="button" class="btn btn-outlined w-100">
                <img
                  class="w-16px me-2"
                  src="/assets/images/login-apple.png"
                  alt=""
                />使用 Apple 繼續
              </button>
            </div>
            <!-- divider -->
            <div class="d-flex gap-2">
              <hr class="w-100 border-white" />
              <p class="w-198px ts-sm text-text-secondary">
                或使用 AI ToolVerse 帳號登入
              </p>
              <hr class="w-100 border-white" />
            </div>
            <!-- form   -->
            <form action="#">
              <div class="mb-4">
                <label for="exampleFormControlInput1" class="form-label mb-1"
                  >電子信箱</label
                >
                <input
                  type="email"
                  class="form-control input-base"
                  id="exampleFormControlInput1"
                  placeholder="請輸入電子信箱"
                />
              </div>
              <div class="mb-2">
                <label for="exampleFormControlInput1" class="form-label mb-1"
                  >密碼</label
                >
                <input
                  type="email"
                  class="form-control input-base"
                  id="exampleFormControlInput1"
                  placeholder="請輸入密碼"
                />
              </div>
              <!--  -->
              <div class="form-help d-flex justify-content-between">
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    value=""
                    id="checkDefault"
                    checked
                  />
                  <label class="form-check-label ts-sm" for="checkDefault">
                    記住帳號
                  </label>
                </div>
                <a class="text-primary text-decoration-none fs-sm" href=""
                  >忘記密碼？</a
                >
              </div>
            </form>
            <a href="" class="btn btn-primary rounded-pill py-2 w-100">
              登入
            </a>
            <div class="register-help d-flex justify-content-center">
              <p class="fs-sm">還沒有帳號？</p>
              <a class="text-primary fs-sm" href="">立即註冊</a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <%- include('./layout/footer'); -%>

    <script type="module" src="../main.js"></script>
  </body>
</html>
